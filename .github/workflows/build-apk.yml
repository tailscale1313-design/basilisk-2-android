name: Build Basilisk 2 APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle
        run: curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/g.zip && unzip -q /tmp/g.zip -d /tmp
      - name: Build APK
        run: /tmp/gradle-8.7/bin/gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Basilisk-2-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
