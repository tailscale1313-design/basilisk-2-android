name: Build Basilisk 2 APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: github.actor != github-actions[bot]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Gradle
        run: curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/g.zip && unzip -q /tmp/g.zip -d /tmp
      - name: Build APK
        run: /tmp/gradle-8.7/bin/gradle --no-daemon assembleDebug
      - name: Publish APK
        run: |
          mkdir -p downloads
          cp app/build/outputs/apk/debug/app-debug.apk downloads/Basilisk-2-debug.apk
          git config user.name github-actions-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add downloads/Basilisk-2-debug.apk
          git commit -m Publish-debug-APK
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: Basilisk-2-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
